name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax check
        run: node --check lib/api.js && node --check lib/index.js && node --check lib/tools.js
      # 0.7.0 起全部测试为纯逻辑（fetch 打桩，不请求 hhxg.top）；原打真实公开端点的 live-smoke 任务随公开端点下线一并删除
      - name: Tests
        run: npm test
      - name: Package dry run
        run: npm pack --dry-run
