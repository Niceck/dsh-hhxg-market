# dsh-hhxg-market — bundle patch layer.
#
# 安装（dsh plugin --profile web add @hhxg/dsh-hhxg-market 或 github:Niceck/dsh-hhxg-market）
# 时由 loader 叠加到 profile 上，挂载本插件行。
#
# inject 必填：等待 tools 服务就绪后再激活，否则 apply 可能在 tools
# 服务存在之前运行，所有工具注册静默失败。
#
# VIP 解锁：在你 profile 的 cordis.patch.yml 里按 id 补 config（dsh 暂不
# 渲染第三方插件的配置项，没有设置界面可填；改完重启 dsh 生效）：
#   - update:
#       - id: hhxg-market
#         config:
#           mcpToken: "<hhxg.top/developer.html#mcp 生成的 MCP Token>"
# 从终端启动 dsh 时也可以不改文件：配置留空，设环境变量 HHXG_MCP_TOKEN。
- insert:
    - id: hhxg-market
      name: '@hhxg/dsh-hhxg-market'
      config: {}
